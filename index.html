<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conny Cooper — Your treatment companion</title>
  <meta
    name="description"
    content="Conny Cooper helps you organise your treatment, remember your medication and stay on track."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8f4;
      color: #1f2933;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 24px 0;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      color: #1f2933;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .nav-links a,
    footer a {
      color: #4c5964;
      text-decoration: none;
    }

    .nav-links a:hover,
    footer a:hover {
      text-decoration: underline;
    }

    .hero {
      min-height: 70vh;
      display: flex;
      align-items: center;
      padding: 70px 0 100px;
    }

    .hero-content {
      max-width: 720px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #62715f;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(3rem, 8vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .hero p {
      max-width: 620px;
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      line-height: 1.65;
      color: #56616b;
    }

    .status {
      margin-top: 36px;
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: #e8eee4;
      font-weight: 700;
      color: #44543f;
    }

    footer {
      border-top: 1px solid #dde1da;
      padding: 28px 0 40px;
      font-size: 0.92rem;
      color: #69737c;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    @media (max-width: 650px) {
      .nav-links {
        gap: 14px;
        font-size: 0.9rem;
      }

      .hero {
        padding-top: 50px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <nav>
        <a class="brand" href="/">Conny Cooper</a>

        <div class="nav-links">
          <a href="/support/">Support</a>
          <a href="/privacy/">Privacy</a>
          <a href="/terms/">Terms</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="hero">
    <div class="container">
      <div class="hero-content">
        <span class="eyebrow">Meet Conny Cooper</span>

        <h1>Your treatment companion.</h1>

        <p>
          A simpler, friendlier way to organise your treatment,
          remember your medication and keep moving forward.
        </p>

        <div class="status">
          Coming soon to the App Store
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container footer-content">
      <span>© 2026 Conny Cooper</span>

      <div class="footer-links">
        <a href="/support/">Support</a>
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
        <a href="mailto:support@connycooper.com">Contact</a>
      </div>
    </div>
  </footer>

</body>
</html>
